[package]
name = "swiftbeat"
version = "0.1.6"
edition = "2024"
description = "Cliente de escritorio ligero para Spotify"
repository = "https://github.com/EliseoDV/Swiftbeat"
license = "MIT"

[dependencies]
librespot-core = "0.8.0"
librespot-playback = "0.8.0"
librespot-metadata = "0.8.0"
librespot-protocol = "0.8.0"
protobuf = "3.7"
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    "software-renderer-systemfonts",
    "raw-window-handle-06",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
open = "5"
log = "0.4"
dirs = "6"
url = "2"
anyhow = "1"
time = { version = "0.3", features = ["local-offset"] }
souvlaki = "0.8"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.18.1"
winresource = "=0.1.31"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
